<!DOCTYPE html>
<html>
<head>
    <title>DOM Example</title>
</head>
<body>

<p id="greet">hello</p>
<p>hi</p>
<p>namaste</p>

<p class="tell">hare krishna</p>

<p class="text">nice to meet you all</p>
<p class="text">ok sir i am coming</p>

<p class="item">ram ram</p>
<p class="item">krishna krishna</p>
<p class="item">gauranga nityananda</p>

<input type="button" value="Click" onclick="change()">

<script>
function change() {

    // 1. Access by ID
    document.getElementById("greet").innerHTML = "Hello World";

    // 2. Access by Tag Name (2nd <p>)
    document.getElementsByTagName("p")[1].style.color = "red";

    // 3. Access by Class Name
    document.getElementsByClassName("tell")[0].style.color = "green";

    // 4. querySelector (first .text)
    document.querySelector(".text").style.backgroundColor = "yellow";

    // 5. querySelectorAll (all .item)


    let items = document.querySelectorAll(".item");

    for (let i = 0; i < items.length; i++) {
        items[i].style.color = "blue";
    }
}
</script>

</body>
</html>
