<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>jQuery Methods</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>
    <p id="para1">hare krishna to you all</p>
    <button id="btn1">change text</button>

    <hr/>

    <button id="hideBtn">hide</button>
    <button id="showBtn">show</button>
    <button id="fadeInBtn">fadeIn</button>
    <button id="fadeOutBtn">fadeOut</button>
    <button id="toggleBtn">toggle & style</button>

    <p id="para2">
        Methods example :
        <br>.hide(), .text(), .html(), .css(), etc.
        <br>Effects Methods e.g. .hide(), .show(), .fadeIn(), .fadeOut(), .toggle(), etc.
    </p>

    <script>
        $(document).ready(function(){
            // change paragraph text using .html()
            $('#btn1').click(function(){
                $('#para1').html("<strong>don't chant this mantra</strong>");
            });

            // effects on para2
            $('#hideBtn').click(function(){ 
                $('#para2').hide(); 
            });
            $('#showBtn').click(function(){ 
                $('#para2').show();
            });
            $('#fadeInBtn').click(function(){
                $('#para2').fadeIn();
            });
            $('#fadeOutBtn').click(function(){ 
                $('#para2').fadeOut();
            });
            $('#toggleBtn').click(function(){ 
                $('#para2').toggle().css({'background': 'red', 'color': 'white', 'padding': '10px'});
            });
        });
    </script>
</body>
</html>
