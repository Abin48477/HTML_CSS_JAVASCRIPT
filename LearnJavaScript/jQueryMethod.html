<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>jQuery Methods</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>
    <p id="para1">hare krishna to you all</p>
    <button id="btn1">change text</button>

    <hr/>

    <button id="hideBtn">hide</button>
    <button id="showBtn">show</button>
    <button id="fadeInBtn">fadeIn</button>
    <button id="fadeOutBtn">fadeOut</button>
    <button id="toggleBtn">toggle</button>

    <p id="para2">
        Methods example :
        <br>.hide(), .text(), .html(), .css(), etc.
        <br>Effects Methods e.g. .hide(), .show(), .fadeIn(), .fadeOut(), .toggle(), etc.
    </p>

    <script>
        $(document).ready(function(){
            // change paragraph text
            $('#btn1').click(function(){
                $('#para1').text("don't chant this mantra");
            });

            // effects on para2
            $('#hideBtn').click(function(){
                 $('#para2').hide();
                 });
            $('#showBtn').click(function(){ 
                $('#para2').show();
             });
            $('#fadeInBtn').dblclick(function(){
                 $('#para2').fadeIn();
                 });
            $('#fadeOutBtn').mouseover(function(){ 
                $('#para2').fadeOut();
             });
            $('#toggleBtn').keypress(function(){ 
                $('#para2').toggle(); 
            });
        });
    </script>
</body>
</html>
