<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculation</title>
</head>

<body>
    <form action="#" method="post">
        <!-- input fields -->
        num1:<input type="text" id="num1" /><br>
        num2:<input type="text" id="num2" /><br><br>

        <!-- operation field -->
        <input type="button" value="add" onclick="operation(this.value)" />
        <input type="button" value="sub" onclick="operation(this.value)" />
        <input type="button" value="mux" onclick="operation(this.value)" />
        <input type="button" value="div" onclick="operation(this.value)" />
        <input type="button" value="mod" onclick="operation(this.value)" /><br><br>

        result:<input type="text" id="result" />
    </form>
    <script>
        const n1 = document.getElementById("num1");
        const n2 = document.getElementById("num2");
        const r = document.getElementById("result");

        function operation(value) {
            //change text to numbers
            const num1 = parseFloat(n1.value);
            const num2 = parseFloat(n2.value);

            switch (value) {
                case "add":
                    result = num1 + num2; break;
                case "sub":
                    result = num1 - num2; break;

                case "mux":
                    result = num1 * num2; break;

                case "div":
                    result = num1 / num2; break;
                case "mod":
                    result = num1 % num2; break;
                default:
                    result = "invalid operation";
            }
            //man.name= abin; vaneko jasti ho  
            //display result

            r.value = result;

        }
    </script>

</body>

</html>
