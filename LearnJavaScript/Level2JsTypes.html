<!--   A JavaScript function is a block of JavaScript code, that can be executed when "called" for.
 For example, a function can be called when an event occurs, like when the user clicks a button.  -->
<!doctype html>
<html>

<head>
    <script src="myScript.js"></script>

<!-- JavaScript in Head -->

    <script>
        function myFunctions() {
            document.getElementById("demo").innerHTML = "Paragraph Changed.hare krishna";
        }
    </script>

</head>

<body>

    <h2>Hare krishna! My First js function in Head</h2>
    <p id="demo">A Paragraph</p>
    <button type="button" onclick="myFunctions()">Try it</button>

    <!-- JavaScript in Body -->

    <h2>Demo JavaScript in body</h2>

    <p id="mantra">A paragraph name as Hare krishna hare krishna krishna krishna hare hare</p>
    <button type="button" onclick="myMantra()">Try it</button>
    <div id="demo">
    </div>
    <script>
        function myMantra() {
            document.getElementById("mantra").innerHTML = "paragraph changed as Hare Rama hare Rama Rama Rama hare hare";
        }
    </script>
    <!-- External JavaScript -->
    <h2>External JavaScript</h2>

    <p id="mydemo">Hare krishna hare krishna </p>
    <button type="button" onclick="myfunction()"> Try it!</button>

</body>

</html>
