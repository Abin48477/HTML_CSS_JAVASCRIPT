<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background-color: lightblue;
        }

        h1{
                color: rgb(21, 21, 196);
                font-size: 40px;
                font-family: Courier, monospace;
                text-align: center;
        }
        p{
            color: rgb(158, 114, 26);
            font-size: 32px;
            font-family: Arial;
            text-align: center;

        }
    </style>

</head>
<body>
    <h1>Hare krishna!!</h1>
    <p>Hari Hari !! I am learning CSS haribol.</p>
</body>
</html>

<!-- Common CSS Property!!
| Property           | Use                              |
| ------------------ | -------------------------------- |
| `color`            | Text color                       |
| `background-color` | Background color                 |
| `font-size`        | Size of text (e.g., `20px`)      |
| `font-family`      | Style of font (e.g., Arial)      |
| `text-align`       | Align text (left, center, right) |
| `padding`          | Space inside box                 |
| `margin`           | Space outside box                | -->
