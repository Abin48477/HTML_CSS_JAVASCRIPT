<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Model</title>
    <style>
        body {
            background-color: aqua;
        }

        .box1 {
            width: 100px;
            height: 100px;
            padding: 20px;
            margin: 40px;
            border: 3px dotted red;
            background-color: white;
        }

        .box2 {
            width: 200px;
            height: 200px;
            padding: 20px;
            border: 3px solid black;
            margin: 40px;

            background-color: white;

        }
    </style>
</head>

<body>
    <div class="box1">
        <p>Box1</p>
    </div>
    <div class="box2">
        <p>Box2</p>
    </div>
</body>

</html>
