<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semantic Page</title>
</head>
<body>
    <header>
        <nav>
            <a href="#">Home</a>
            <a href="#">About Us</a>
            <a href="#">Contact</a>
        </nav>
    </header>
    <section>
        <h2>About Me</h2>
        <p>I am learning HTML with semantic Tags.</p>

    </section>
    <article>
        <h2>My Blog Post</h2>
        <p>Hey!This is my cool blog post</p>
    </article>

    <aside>
        <h2>Quick Links</h2>
        <ul>
            <li><a href="#" >www.githum.com</a></li>
            <li><a href="#" >www.facebook.com</a></li>
            <li><a href="#" >www.w3school.com</a></li>
        </ul>
    </aside>
    <footer>
        <p>Email:ghimireabin56@gmial.com</p>
    </footer>
</body>
</html>
<!-- | Tag         | Meaning                            |
| ----------- | ---------------------------------- |
| `<header>`  | Top of page or section             |
| `<footer>`  | Bottom info (copyright, links)     |
| `<nav>`     | Navigation links                   |
| `<section>` | Page section                       |
| `<article>` | Independent content like blog post |
| `<aside>`   | Sidebar or related links           | -->
