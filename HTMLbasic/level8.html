<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Time</title>
  <style>
    .container {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 200px;
      background-color: grey;
      border-radius: 50%;
      border: 2px solid rgb(121, 116, 125);
    }
  </style>
</head>
<body>
  <div class="container">
    <p id="myclock">hello</p>
    <button type="button" onclick="clock()">Show Clock</button>
  </div>

  <script>
    function clock() {
      var now = new Date();
      document.getElementById("myclock").innerText = now.toUTCString();
      setTimeout(clock, 1000);
    }
  </script>
</body>
</html>
