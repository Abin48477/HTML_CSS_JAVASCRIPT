<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio & Video</title>
</head>

<body>
    <h2>My Favorite Song</h2>
    <audio controls>
        <source src="Audio.mp3" type="audio/mpeg">

    </video>



</body>

</html>
