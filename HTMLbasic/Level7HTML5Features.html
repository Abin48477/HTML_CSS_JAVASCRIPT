<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simple Form & Canvas</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
    }

    input {
      display: block;
      width: 100%;
      max-width: 300px;
      margin: 10px 0;
      padding: 8px;
    }

    canvas {
      width: 100%;
      max-width: 300px;
      margin-top: 20px;
      border: 1px solid black;
    }
  </style>
</head>
<body>

  <h2>Simple Input Form</h2>
  <input type="email" placeholder="Enter your email" required />
  <input type="url" placeholder="Enter your link" required />
  <input type="date" />
  <input type="time" />
  <input type="color" />
  <input type="range" />

  <h3>Canvas Drawing</h3>
  <canvas id="myCanvas" width="300" height="150"></canvas>

  <script>
    const canvas = document.getElementById("myCanvas");
    const ctx = canvas.getContext("2d");
    ctx.fillStyle = "blue";
    ctx.fillRect(30, 30, 100, 50);
  </script>


</body>
</html>
