<!--Creating a contact form-->

<!DOCTYPE html>
<html>

<head>

    <title>My Contact Form</title>

</head>

<body>
    <h1>MY Details Here!!</h1>
    <!-- <form action = "#"  method = post> -->
    <form>
        <label for="name">Name:</label><br>
        <input type="text" id="name" placeholder="Enter your name"  required> <br>

        <label for="email">Email:</label><br>
        <input type="email" id="email" placeholder="Enter your email"  required><br>

        <label for="message">Message:</label><br>
        <textarea id="message" placeholder="Enter your message" name="message" rows="4" cols="50"
            required></textarea><br>

        <label for="gender"> Gender:</label><br>

        <input type="radio" id="gender" value="male">Male<br>
        <input type="radio" id="gender" value="female">Female <br>
        <input type="radio" id="gender" value="other">Others<br>

        <label for="hobbies" >Hobbies:</label><br>
        <input type="checkbox" id="hobbies" value="reading"> Reading Bhagvat Geeta<br>
        <input type="checkbox" id="hobbies" value="traveling"> Traveling all over the Universe<br>
        <input type="checkbox" id="hobbies" value="coding"> Coding<br>
        <input type="checkbox" id="hobbies" value="gaming"> Gaming<br>
        <button>Submit</button>"<br>
    </form>
</body>

</html>
