<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Landing Page</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #8ec5fc, #e0c3fc);
      min-height: 100vh;
      color: #222;
    }
    .main-section {
      max-width: 480px;
      margin: 80px auto;
      background: rgba(255,255,255,0.90);
      border-radius: 16px;
      box-shadow: 0 10px 32px rgba(115,85,215,0.07);
      padding: 48px 32px;
      text-align: center;
    }
    .main-section h1 {
      font-size: 2rem;
      margin-bottom: 14px;
      color: #4c6ef5;
    }
    .main-section p {
      font-size: 1.08rem;
      margin-bottom: 36px;
      color: #555;
    }
    .cta-btn {
      background: linear-gradient(135deg, #4c6ef5, #b197fc);
      color: white;
      border: none;
      padding: 13px 38px;
      border-radius: 100px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 2px 20px rgba(78, 97, 245, 0.12);
      transition: background 0.2s;
    }
    .cta-btn:hover {
      background: linear-gradient(135deg, #6c63ff, #a78bfa);
    }
    @media (max-width: 640px) {
      .main-section {
        margin: 20px 6px;
        padding: 36px 10px;
      }
    }
  </style>
</head>
<body>
  <div class="main-section">
    <h1>Start Your Success Story</h1>
    <p>Build beautiful websites easily with our landing page builder. No coding, just results.</p>
    <button class="cta-btn">Get Started</button>
  </div>
</body>
</html>
