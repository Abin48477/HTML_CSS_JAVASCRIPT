<!--
| Value          | Meaning                                   |
| -------------- | ----------------------------------------- |
| `block`        | Full width, new line (e.g. `<div>`)       |
| `inline`       | Stays with other elements (e.g. `<span>`) |
| `inline-block` | Inline but can set width/height           |
| `none`         | Hides the element                         | -->
<!DOCTYPE html>
<html lang="en">

<head>
  <style>
    /* .box1 {
      width: 200px;
      height: 100px;
      background-color: green;
      float: left;
      margin-right: 20px;
    } */

    .box2 {
      position:relative;
        left:10px;
        top:10px;
      width: 200px;
      height: 100px;
      background-color: skyblue;
      float: left;
      margin-right: 20px;
    }

    .box3 {
      position:absolute;
      left:0px;
      top: 0px;

      width: 200px;
      height: 100px;
      background-color: yellow;
      float: left;
    }

    .clear {
      clear: all;
    }
  </style>
</head>

<body>

  <!-- <div class="box1">Left Box green</div> -->
  <div class="box2">Right Box skyblue
    <div class="box3">Center Box yellow</div>
  </div>
  <div class="clear"></div>
  <!-- 📌 Add clear: both; after floated boxes to fix layout. -->
</body>

</html>
