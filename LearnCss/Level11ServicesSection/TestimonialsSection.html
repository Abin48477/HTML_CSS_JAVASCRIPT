<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <style>
        :root {
  --ayur-green: #1f8a4d;
  --ayur-light: #f3fff8;
  --ayur-dark: #123326;
}

.testimonials {
  padding: 3rem 1.5rem;
  background: var(--ayur-light);
  text-align: center;
}

.testimonials-title {
  font-size: 2rem;
  color: var(--ayur-dark);
  margin-bottom: 0.25rem;
}

.testimonials-subtitle {
  color: #48615a;
  margin-bottom: 2rem;
}

.testimonials-wrapper {
  max-width: 700px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  gap: 1rem;
}

.testimonial-card {
  flex: 1;
  background: #fff;
  padding: 1.75rem 1.5rem;
  border-radius: 1.25rem;
  box-shadow: 0 18px 40px rgba(0, 0, 0, 0.08);
  text-align: left;
}

.testimonial-text {
  font-size: 0.98rem;
  line-height: 1.6;
  margin-bottom: 1.5rem;
  color: #31413b;
}

.testimonial-user {
  display: flex;
  align-items: center;
  gap: 0.75rem;
}

.user-avatar {
  width: 52px;
  height: 52px;
  border-radius: 50%;
  object-fit: cover;
  border: 2px solid var(--ayur-green);
}

.user-name {
  font-size: 1rem;
  margin-bottom: 0.1rem;
  color: var(--ayur-dark);
}

.user-role {
  font-size: 0.85rem;
  color: #6b7c75;
}

.nav-btn {
  border: none;
  background: #fff;
  width: 40px;
  height: 40px;
  border-radius: 999px;
  box-shadow: 0 10px 25px rgba(0, 0, 0, 0.12);
  color: var(--ayur-green);
  font-size: 1.2rem;
  cursor: pointer;
  transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
}

.nav-btn:hover {
  transform: translateY(-2px);
  background: var(--ayur-green);
  color: #fff;
  box-shadow: 0 14px 30px rgba(31, 138, 77, 0.35);
}

.dots {
  margin-top: 1.25rem;
  display: flex;
  justify-content: center;
  gap: 0.4rem;
}

.dots button {
  width: 8px;
  height: 8px;
  border-radius: 999px;
  border: none;
  background: #b3c6bf;
  cursor: pointer;
  transition: width 0.2s ease, background 0.2s ease;
}

.dots button.active {
  width: 18px;
  background: var(--ayur-green);
}

@media (max-width: 600px) {
  .testimonials-wrapper {
    gap: 0.5rem;
  }

  .nav-btn {
    width: 32px;
    height: 32px;
    font-size: 1rem;
  }

  .testimonial-card {
    padding: 1.5rem 1.25rem;
  }
}

    </style>
    
    <section class="testimonials" id="testimonials">
  <h2 class="testimonials-title">What our patients say</h2>
  <p class="testimonials-subtitle">Real stories from Ayurvedic healing journeys</p>

  <div class="testimonials-wrapper">
    <button class="nav-btn prev-btn" aria-label="Previous testimonial">&#10094;</button>

    <div class="testimonial-card">
      <p class="testimonial-text"></p>
      <div class="testimonial-user">
        <img class="user-avatar" src="" alt="Patient photo">
        <div>
          <h3 class="user-name"></h3>
          <p class="user-role"></p>
        </div>
      </div>
    </div>

    <button class="nav-btn next-btn" aria-label="Next testimonial">&#10095;</button>
  </div>

  <div class="dots"></div>
</section>

    <script>
        const testimonialsData = [
  {
    text: "After using this app for 3 months, my digestion improved and I feel more energetic with daily herbal routines.",
    name: "Anjali Sharma",
    role: "IT professional, 27",
    avatar: "https://via.placeholder.com/80x80.png?text=A"
  },
  {
    text: "The personalized dosha quiz and remedies helped me balance my sleep and stress in a natural way.",
    name: "Rahul Verma",
    role: "Student, 22",
    avatar: "https://via.placeholder.com/80x80.png?text=R"
  },
  {
    text: "I love how the app reminds me to drink kadha and do simple yoga stretches for my back pain.",
    name: "Sita Thapa",
    role: "Teacher, 34",
    avatar: "https://via.placeholder.com/80x80.png?text=S"
  }
];

const textEl = document.querySelector(".testimonial-text");
const nameEl = document.querySelector(".user-name");
const roleEl = document.querySelector(".user-role");
const avatarEl = document.querySelector(".user-avatar");
const prevBtn = document.querySelector(".prev-btn");
const nextBtn = document.querySelector(".next-btn");
const dotsContainer = document.querySelector(".dots");

let currentIndex = 0;

// create dots
testimonialsData.forEach((_, idx) => {
  const dot = document.createElement("button");
  if (idx === 0) dot.classList.add("active");
  dot.addEventListener("click", () => goToTestimonial(idx));
  dotsContainer.appendChild(dot);
});

const dots = dotsContainer.querySelectorAll("button");

function renderTestimonial(index) {
  const t = testimonialsData[index];
  textEl.textContent = t.text;
  nameEl.textContent = t.name;
  roleEl.textContent = t.role;
  avatarEl.src = t.avatar;
  avatarEl.alt = t.name;

  dots.forEach(d => d.classList.remove("active"));
  dots[index].classList.add("active");
}

function goToTestimonial(index) {
  if (index < 0) {
    currentIndex = testimonialsData.length - 1;
  } else if (index >= testimonialsData.length) {
    currentIndex = 0;
  } else {
    currentIndex = index;
  }
  renderTestimonial(currentIndex);
}

prevBtn.addEventListener("click", () => goToTestimonial(currentIndex - 1));
nextBtn.addEventListener("click", () => goToTestimonial(currentIndex + 1));

// auto-slide every 6 seconds
setInterval(() => {
  goToTestimonial(currentIndex + 1);
}, 6000);

// initial load
renderTestimonial(currentIndex);

    </script>
</body>
</html>
