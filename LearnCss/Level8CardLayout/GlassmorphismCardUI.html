<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- Make page look good on mobile and desktop -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Glass UI Card</title>

  <style>
    /* Reset basic styles and set common font */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    }

    /* Full screen center layout + dark gradient background */
    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at top left, #4c6ef5, #343a40 35%, #111827 100%);
      color: #f8fafc;
      overflow: hidden;
    }

    /* Colorful blurred circles behind the card */
    .blob {
      position: fixed;
      width: 420px;
      height: 420px;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.8;
      z-index: -2;               /* Keep blobs behind everything */
      animation: float 12s ease-in-out infinite alternate; /* Slow floating animation */
    }

    /* First blob (blue, top-left) */
    .blob:nth-child(1) {
      background: #4c6ef5;
      top: -80px;
      left: -60px;
    }

    /* Second blob (pink, bottom-right) */
    .blob:nth-child(2) {
      background: #e859ff;
      bottom: -120px;
      right: -40px;
      animation-delay: -4s;      /* Start a bit earlier for variety */
    }

    /* Third blob (green, center) */
    .blob:nth-child(3) {
      background: #20c997;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      opacity: 0.4;
      animation-delay: -7s;
    }

    /* Simple up/down + slight zoom animation for blobs */
    @keyframes float {
      to {
        transform: translate3d(20px, -30px, 0) scale(1.05);
      }
    }

    /* Wrapper to center the card */
    .container {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    /* Main glass card box */
    .glass-card {
      position: relative;
      width: min(380px, 90vw);   /* Responsive width: max 380px, otherwise 90% of screen */
      padding: 28px 26px 26px;
      border-radius: 24px;

      /* Light gradient + transparent background for glass effect */
      background: radial-gradient(circle at top left, rgba(255, 255, 255, 0.24), rgba(255, 255, 255, 0.06)) border-box;
      border: 1px solid rgba(255, 255, 255, 0.24);
      box-shadow:
        0 18px 45px rgba(15, 23, 42, 0.75),      /* Big soft shadow */
        0 0 0 1px rgba(255, 255, 255, 0.04);     /* Thin outer line */

      /* Blur background behind the card (main glassmorphism) */
      backdrop-filter: blur(22px) saturate(130%);
      -webkit-backdrop-filter: blur(22px) saturate(130%);

      color: #f9fafb;
      text-align: left;
      overflow: hidden;
      transition: transform 0.4s ease, box-shadow 0.4s ease, border-color 0.4s ease;
    }

    /* Bright light streak on top of card */
    .glass-card::before {
      content: "";
      position: absolute;
      inset: -40%;
      background: conic-gradient(
        from 200deg,
        rgba(255, 255, 255, 0.2),
        transparent,
        rgba(255, 255, 255, 0.06),
        transparent
      );
      opacity: 0.6;
      mix-blend-mode: screen;    /* Blend nicely with card */
      transform: translate3d(-40%, -10%, 0) rotate(8deg);
      pointer-events: none;
    }

    /* Extra border highlight that appears on hover */
    .glass-card::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      border: 1px solid rgba(255, 255, 255, 0.35);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }

    /* Lift card on hover */
    .glass-card:hover {
      transform: translateY(-6px) scale(1.01);
      box-shadow:
        0 26px 60px rgba(15, 23, 42, 0.9),
        0 0 0 1px rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.4);
    }

    /* Show highlight border when hovering */
    .glass-card:hover::after {
      opacity: 0.38;
    }

    /* Small pill badge at the top of the card */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 999px;
      background: linear-gradient(135deg, rgba(76, 175, 255, 0.32), rgba(156, 81, 255, 0.42));
      border: 1px solid rgba(255, 255, 255, 0.45);
      font-size: 11px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #e5edff;
      margin-bottom: 14px;
      backdrop-filter: blur(10px);
    }

    /* Green dot inside badge */
    .badge-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #51cf66;
      box-shadow: 0 0 0 6px rgba(81, 207, 102, 0.25);
    }

    /* Main heading text */
    .glass-card h1 {
      font-size: 26px;
      line-height: 1.25;
      margin-bottom: 6px;
    }

    /* Subtitle under heading */
    .subtitle {
      font-size: 14px;
      color: #cbd5f5;
      margin-bottom: 18px;
    }

    /* Row of small info text below subtitle */
    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 18px;
      font-size: 12px;
      color: #e5e7eb;
      margin-bottom: 18px;
    }

    /* Each small info item */
    .meta span {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      opacity: 0.92;
    }

    /* Small colored dot for meta items */
    .meta-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: linear-gradient(135deg, #4dabf7, #e599f7);
    }

    /* Buttons row */
    .actions {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-top: 4px;
    }

    /* Main (primary) button */
    .btn-primary {
      padding: 9px 18px;
      border-radius: 999px;
      border: none;
      outline: none;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #0b1220;
      background: linear-gradient(135deg, #8be2ff, #f6d365);
      box-shadow:
        0 10px 25px rgba(15, 23, 42, 0.75),
        0 0 0 1px rgba(255, 255, 255, 0.25);
      transition: transform 0.25s ease, box-shadow 0.25s ease, filter 0.25s ease;
      white-space: nowrap;
    }

    /* Slight lift on primary button hover */
    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow:
        0 14px 32px rgba(15, 23, 42, 0.9),
        0 0 0 1px rgba(255, 255, 255, 0.4);
      filter: brightness(1.05);
    }

    /* Outline (secondary) button */
    .btn-secondary {
      background: transparent;
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, 0.7);
      color: #e5e7eb;
      padding: 9px 14px;
      font-size: 12px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      backdrop-filter: blur(8px);
      transition: border-color 0.25s ease, background-color 0.25s ease, color 0.25s ease;
    }

    /* Darker background on secondary button hover */
    .btn-secondary:hover {
      background-color: rgba(15, 23, 42, 0.65);
      border-color: rgba(226, 232, 240, 0.9);
      color: #f9fafb;
    }

    /* Small arrow icon inside secondary button */
    .btn-secondary span {
      font-size: 14px;
      transform: translateY(0.5px);
    }

    /* Make card slightly smaller on small screens */
    @media (max-width: 480px) {
      .glass-card {
        padding: 24px 20px 20px;
        border-radius: 20px;
      }

      .glass-card h1 {
        font-size: 22px;
      }

      .subtitle {
        font-size: 13px;
      }
    }
  </style>
</head>
<body>
  <!-- Three blurred color blobs in the background -->
  <div class="blob"></div>
  <div class="blob"></div>
  <div class="blob"></div>

  <!-- Centered glass card container -->
  <div class="container">
    <div class="glass-card">
      <!-- Small pill badge on top -->
      <div class="badge">
        <span class="badge-dot"></span>
        <span>Welcome back</span>
      </div>

      <!-- Main title text -->
      <h1>Hello, Abin 👋</h1>

      <!-- Short description text -->
      <p class="subtitle">A clean glassmorphism card with smooth glow, depth, and soft hover animation.</p>

      <!-- Extra info row -->
      <div class="meta">
        <span><span class="meta-dot"></span> Frontend Playground</span>
        <span><span class="meta-dot"></span> Glassmorphism UI</span>
      </div>

      <!-- Buttons -->
      <div class="actions">
        <button class="btn-primary">Explore</button>
        <button class="btn-secondary">
          Preview
          <span>↗</span>
        </button>
      </div>
    </div>
  </div>
</body>
</html>
