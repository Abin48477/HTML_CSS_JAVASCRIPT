<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Services Section</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: #f3f3f3;
            padding: 40px 0;
        }

        .container {
            max-width: 1100px;
            margin: auto; /* center horizontally */
            padding: 0 20px;
            text-align: center;
        }

        .title {
            font-size: 36px;
            margin-bottom: 40px;
        }

        /* GRID OF CARDS */
        .services-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
        }

        /* CARD */
        .card {
            background: white;
            padding: 25px;
            border-radius: 14px;
            box-shadow: 0 0 20px rgba(0,0,0,0.08);
            transition: transform 0.3s, box-shadow 0.3s;
        }

        /* ICON */
        .icon {
            font-size: 4rem;
            margin-bottom: 15px;
        }

        /* CARD HOVER EFFECT */
        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }

        /* TITLE INSIDE CARD */
        .card h3 {
            margin: 10px 0;
            font-size: 24px;
        }

        .card p {
            opacity: 0.8;
        }

        /* ⭐ RESPONSIVE */
        @media (max-width: 900px) {
            .services-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 600px) {
            .services-grid {
                grid-template-columns: 1fr;
            }
        }

    </style>
</head>
<body>

    <div class="container">

        <h1 class="title">Our Services</h1>

        <div class="services-grid">

            <div class="card">
                <div class="icon">⚡</div>
                <h3>Fast Performance</h3>
                <p>Your website loads fast and runs smoothly.</p>
            </div>

            <div class="card">
                <div class="icon">🎨</div>
                <h3>Clean Design</h3>
                <p>Modern, simple, beautiful design for all devices.</p>
            </div>

            <div class="card">
                <div class="icon">🔒</div>
                <h3>Secure Code</h3>
                <p>We follow best security practices always.</p>
            </div>

        </div>

    </div>

</body>
</html>
