<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AbinWeb | Footer</title>

  <!-- Font Awesome for icons -->
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <!-- ALL CSS IN ONE PLACE -->
  <style>
    /* ============ 1. VARIABLES ============ */
    :root {
      --bg-color: #111827;      /* Footer background */
      --text-color: #9ca3af;    /* Normal text */
      --white: #ffffff;         /* Headings & icons */
      --accent: #3b82f6;        /* Accent blue */
      --grid-gap: 2.5rem;       /* Gap between columns */
    }

    /* ============ 2. GLOBAL RESET ============ */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: #020617;
      color: var(--text-color);
    }

    /* Optional demo content space so footer looks like a footer */
    main {
      flex: 1;
    }

    /* ============ 3. FOOTER BASE ============ */
    footer {
      background-color: var(--bg-color);
      padding: 3.5rem 1.5rem 1.5rem;
      font-size: 0.95rem;
      line-height: 1.6;
    }

    /* ============ 4. GRID LAYOUT ============ */
    .footer-grid {
      max-width: 1100px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: var(--grid-gap);
    }

    .footer-section h3 {
      color: var(--white);
      font-size: 1.4rem;
      margin-bottom: 0.8rem;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .footer-section h4 {
      color: var(--white);
      font-size: 1.05rem;
      margin-bottom: 1.2rem;
      font-weight: 500;
      position: relative;
    }

    .footer-section h4::after {
      content: '';
      position: absolute;
      left: 0;
      bottom: -0.5rem;
      width: 34px;
      height: 2px;
      background: var(--accent);
      border-radius: 999px;
    }

    .footer-section p {
      margin-bottom: 0.75rem;
      opacity: 0.9;
    }

    /* ============ 5. LINKS ============ */
    .footer-section ul {
      list-style: none;
    }

    .footer-section ul li {
      margin-bottom: 0.6rem;
    }

    .footer-section ul li a {
      color: var(--text-color);
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .footer-section ul li a:hover {
      color: var(--accent);
    }

    /* ============ 6. CONTACT ICONS ============ */
    .footer-section i {
      margin-right: 8px;
      color: var(--accent);
      font-size: 0.95em;
    }

    /* ============ 7. SOCIAL ICONS ============ */

    /* Brand column as a flex column so spacing is nice */
    .footer-brand {
      display: flex;
      flex-direction: column;
      gap: 0.9rem;
    }

    .footer-brand p {
      max-width: 320px;
    }

    /* Wrapper for icons */
    .social {
      display: flex;
      justify-content: center;  /* CENTER the row of icons */
      align-items: center;
      gap: 14px;
      margin-top: 0.4rem;
      width: 100%;
    }

    /* Each icon circle */
    .social a {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(148, 163, 184, 0.4);
      color: var(--white);
      text-decoration: none;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      transition: transform 0.2s ease, box-shadow 0.2s ease,
                  background 0.2s ease, border-color 0.2s ease;
    }

    .social a i {
      font-size: 0.9rem;
      line-height: 1;
    }

    .social a:hover {
      background: linear-gradient(135deg, var(--accent), #60a5fa);
      border-color: rgba(59, 130, 246, 0.9);
      transform: translateY(-3px);
      box-shadow: 0 10px 20px rgba(15, 23, 42, 0.7);
    }

    /* ============ 8. COPYRIGHT BAR ============ */
    .copyright {
      margin-top: 3rem;
      padding-top: 1.2rem;
      border-top: 1px solid rgba(148, 163, 184, 0.3);
      text-align: center;
      font-size: 0.85rem;
      color: var(--text-color);
      opacity: 0.9;
    }

    .copyright a {
      color: var(--accent);
      text-decoration: none;
      margin-left: 0.4rem;
      font-size: 0.8rem;
    }

    .copyright a:hover {
      text-decoration: underline;
    }

    /* ============ 9. MOBILE ============ */
    @media (max-width: 600px) {
      footer {
        padding: 2.8rem 1.2rem 1.2rem;
      }

      .footer-grid {
        gap: 2rem;
      }

      .footer-brand {
        align-items: center;   /* center brand + icons on mobile */
        text-align: center;
      }

      .footer-section h3 {
        font-size: 1.3rem;
      }

      .footer-section h4 {
        font-size: 1rem;
      }

      .footer-section h4::after {
        left: 50%;
        transform: translateX(-50%);
      }
    }
  </style>
</head>
<body>

  <!-- Just demo content so footer sits at the bottom -->
  <main></main>

  <!-- ================= FOOTER ================= -->
  <footer>
    <div class="footer-grid">
      
      <!-- Brand section -->
      <div class="footer-section footer-brand">
        <h3>AbinWeb</h3>
        <p>Learn CSS with real projects and 80/20 principles. Building the web, one pixel at a time.</p>

        <div class="social">
          <a href="#"><i class="fa-brands fa-facebook-f"></i></a>
          <a href="#"><i class="fa-brands fa-instagram"></i></a>
          <a href="#"><i class="fa-brands fa-github"></i></a>
          <a href="#"><i class="fa-brands fa-youtube"></i></a>
        </div>
      </div>

      <!-- Links section -->
      <div class="footer-section">
        <h4>Quick Links</h4>
        <ul>
          <li><a href="#">Home</a></li>
          <li><a href="#">Tutorials</a></li>
          <li><a href="#">Projects</a></li>
          <li><a href="#">About</a></li>
          <li><a href="#">Contact</a></li>
        </ul>
      </div>

      <!-- Contact section -->
      <div class="footer-section">
        <h4>Contact</h4>
        <p><i class="fa-solid fa-envelope"></i>abin@example.com</p>
        <p><i class="fa-solid fa-phone"></i>+977 9800000000</p>
        <p><i class="fa-solid fa-location-dot"></i>Kathmandu, Nepal</p>
      </div>

    </div>

    <div class="copyright">
      <span>&copy; 2025 AbinWeb — All Rights Reserved.</span>
      <a href="#top">Back to top ↑</a>
    </div>
  </footer>
  <!-- ========================================== -->

</body>
</html>
