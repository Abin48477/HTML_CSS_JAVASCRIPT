<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styleproject1.css">
</head>
<body>
    <nav class="nav">
        <div class="logo">AbinDev</div>

        <ul class="nav-links">
            <li>Home</li>
            <li>About</li>
            <li>Services</li>
            <li>Contact</li>
        </ul>
         <div class="hamburger">☰</div> <!-- hamburger menu icon -->
    </nav>

    
<script>
const navLinks = document.querySelector('.nav-links');
const hamburger = document.querySelector('.hamburger');

hamburger.onclick = () => {
    navLinks.classList.toggle('active');
};
// When button is clicked:

// If menu is hidden → show it
// If menu is shown → hide it
</script>

</body>
</html>
