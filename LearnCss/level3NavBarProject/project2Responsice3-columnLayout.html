<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <section class="responsive-grid">

        <div class="box a">Left Sidebar</div>
        <div class="box b">Main Content</div>
        <div class="box c">Right Sidebar</div>
    </section>
    <!-- desktop view -->
    <style>
        .responsive-grid {
            display: grid;
            grid-template-columns: repeat(3,1fr);/*Three equal columns for larger screen */
            gap: 20px;
            padding: 20px;
            background-color: #f5f5f5;
        }

        .box {
            background-color: rgb(222, 172, 172);
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            border: 2px solid #ccc;
        }

    </style>

    <!-- Tablet view -->
    <style>
        @media (max-width: 768px) {
            .responsive-grid {
                grid-template-columns: 1fr 1fr;
                /* 2 columns */
            }
            }
        
    </style>
    <!-- Mobile view -->
    <style>
        @media (max-width: 480px) {
            .responsive-grid {
                grid-template-columns: 1fr;
                /* 1 column  layout*/
            }

        }
    </style>
</body>

</html>
<!-- 
 Left Brother → Sidebar

Middle Brother → Main Content

Right Brother → Info/Ads -->
