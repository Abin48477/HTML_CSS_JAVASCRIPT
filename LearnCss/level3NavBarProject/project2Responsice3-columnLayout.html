<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <section class="responsive-grid">

        <div class="box a">Left Sidebar</div>
        <div class="box b">Main Content</div>
        <div class="box c">Right Sidebar</div>
    </section>
    <!-- desktop view -->
    <style>
        .responsive-grid {
            display: grid;
            grid-template-columns: repeat(3,1fr);/*Three equal columns for larger screen */
            gap: 20px;
            padding: 20px;
            background-color: #f5f5f5;
        }

        .box {
            background-color: rgb(222, 172, 172);
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            border: 2px solid #ccc;
        }

    </style>

    <!-- Tablet view -->
    <style>
        @media (max-width: 768px) {
            .responsive-grid {
                /* grid-template-columns: 1fr 1fr; */
                grid-template-columns: 2fr 1fr;
                /* 2 columns */
            }
             /* .box.c {
                grid-column: span 2;
                }
                /* Make the right sidebar span across both columns */
            
        }
        
    </style>
    <!-- Mobile view -->
    <style>
        @media (max-width: 480px) {
            .responsive-grid {
                grid-template-columns: 1fr;
                /* 1 column  layout*/
            }
        }
    </style>
</body>

</html>
<!-- ⭐ 1. repeat()
👉 Helps you write columns/rows without typing them again and again.
Without repeat():
grid-template-columns: 1fr 1fr 1fr;
With repeat():
grid-template-columns: repeat(3, 1fr);
✔ Saves time
✔ Cleaner code 
⭐ 2. minmax(min, max)
👉 Sets minimum and maximum size of a column or row.
Example:
grid-template-columns: minmax(200px, 1fr);  
Means:
Never smaller than 200px
Can grow up to 1fr
Perfect for responsive boxes.
⭐ 3. auto-fit
👉 Automatically fits as many boxes in a row as possible.
Example:
grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
This means:

Each box is at least 200px
Can grow to 1fr
Grid will automatically add/remove columns based on screen size
(like magic responsive layout) -->
