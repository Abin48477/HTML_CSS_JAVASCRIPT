<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="parent">

    <div class="child">Box1</div>
</div>
<style>
    .parent {
  position: relative;   /* parent (mom/dad) */
}

.child {
  position: absolute;   /* child */
  top: 10px;
  right: 20px;          /* positioned inside parent */
}

</style>
    
</body>
</html>
