
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
    *{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial;
}

body {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;

    background: linear-gradient(135deg, #4c6ef5, #b197fc);
}

.container {
    display: flex;
    justify-content: center;
    align-items: center;
}

.glass-card {
    width: 350px;
    padding: 30px;
    text-align: center;

    background: rgba(255,255,255,0.1);
    border-radius: 20px;

    backdrop-filter: blur(15px);
    border: 1px solid rgba(255,255,255,0.3);

    color: white;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
}

.glass-card h1 {
    font-size: 28px;
    margin-bottom: 10px;
}

.glass-card p {
    font-size: 16px;
    margin-bottom: 25px;
}

button {
    padding: 10px 20px;
    background: rgba(255,255,255,0.2);
    border: none;
    border-radius: 10px;
    color: white;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    background: rgba(255,255,255,0.4);
}
</style>
</head>
<body>

    <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glass UI Card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div class="container">
        <div class="glass-card">
            <h1>Hello Abin</h1>
            <p>This is a modern glassmorphism UI card.</p>
            <button>Explore</button>
        </div>
    </div>

</body>
</html>
