<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Image Gallery</title>
<style>
    *{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial;
}

body {
    background: #f4f4f4;
    padding: 20px;
}

.title {
    text-align: center;
    margin-bottom: 20px;
    font-size: 32px;
}

.gallery {
    display: grid;
    gap: 15px;

    /* The magic line */
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
}

.gallery img {
    width: 100%;
    height: 200px;
    object-fit: cover;

    border-radius: 10px;
    transition: transform .3s;
}

.gallery img:hover {
    transform: scale(1.05);
}

</style>
<body>

    <h1 class="title">My Image Gallery</h1>

    <div class="gallery">
        <img src="https://picsum.photos/400?1" alt="">
        <img src="https://picsum.photos/400?2" alt="">
        <img src="https://picsum.photos/400?3" alt="">
        <img src="https://picsum.photos/400?4" alt="">
        <img src="https://picsum.photos/400?5" alt="">
        <img src="https://picsum.photos/400?6" alt="">
    </div>

</body>
</html>
