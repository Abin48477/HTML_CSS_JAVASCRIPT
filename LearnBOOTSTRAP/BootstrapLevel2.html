<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <!-- Grid System in Bootstrap -->
    <div class="container">
        <div class="row">
            <div class="col">Column 1</div>
            <div class="col">Column 2</div>
            <div class="col">Column 3</div>
        </div>
    </div>
    <p> bootstap has total 12 columns</p>
    <!-- margin top 4 -->
    <div class="container mt-4">
        <div class="row">
            <!-- p-3 meaning padding 3 in all sides top,bottom,left,right -->
            <!-- col-6 = 6/12 width (half the row)
                 col-4 = 4/12 width (one-third)
                 col-3 = 3/12 width (one-fourth) -->
            <div class="col-3 bg-primary text-white p-3">Column 1</div>
            <div class="col-6 bg-success text-white p-3">Column 2</div>
            <div class="col-3 bg-danger text-white p-3">Column 3</div>
        </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-ENjdO4Dr2bkBIFxQpeoA6V6gkQ5K5b5Q5p5b5Q5p5b5Q5p5b5Q5p5b5Q5p5b5Q5p5"
        crossorigin="anonymous"></script>
</body>

</html>
